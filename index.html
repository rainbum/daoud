<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
  <meta name="theme-color" content="#ede9e1" />
  <meta name="description" content="In loving memory of Mohammad Daoud, 1987–2026." />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>In Loving Memory — Mohammad Daoud</title>
  <link rel="icon" type="image/svg+xml" href="assets/daoud-favicon.svg" />
  <link rel="preload" href="assets/pages/page-001.webp" as="image" type="image/webp" />
  <link rel="preload" href="assets/pages/page-002.webp" as="image" type="image/webp" />
  <link rel="stylesheet" href="styles.css?v=461" />
  <script defer src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.min.js"></script>
  <script defer src="app.js?v=461"></script>
  <style id="daoud-menu-isolated">
    #daoud-site-menu{position:absolute;z-index:1000;right:clamp(16px,2.4vw,42px);top:48px;display:block;visibility:visible;opacity:1;color:#5e5345;pointer-events:auto;touch-action:manipulation;font-size:12px}
    #daoud-site-menu>summary{display:flex;align-items:center;justify-content:center;gap:6px;min-height:34px;padding:0 12px;list-style:none;cursor:pointer;background:#faf8f4;border:1px solid #a78c58;border-radius:999px;box-shadow:0 3px 14px rgba(83,70,52,.12);margin-left:auto;width:max-content;font:500 12px/1 system-ui,sans-serif;color:#5e5345;white-space:nowrap}
    #daoud-site-menu>summary::-webkit-details-marker{display:none}
    #daoud-site-menu>summary:focus-visible,#daoud-site-menu a:focus-visible{outline:2px solid #a78c58;outline-offset:2px}
    #daoud-site-menu nav{position:absolute;right:0;top:40px;width:174px;background:#faf8f4;border:1px solid rgba(77,65,49,.15);border-radius:12px;padding:5px;box-shadow:0 6px 20px #53463420}
    #daoud-site-menu a{display:block;text-decoration:none;color:inherit;padding:9px 10px;border-radius:7px;white-space:nowrap}
    #daoud-site-menu a:hover{background:#ede9e1}
    @media(max-width:760px){#daoud-site-menu{right:10px;top:43px}}
    .reader:fullscreen #daoud-site-menu,.reader.immersive-fallback #daoud-site-menu{top:calc(48px + env(safe-area-inset-top,0px))}
  </style>
</head>
<body>
  <main id="reader" class="reader" aria-label="Interactive memorial book for Mohammad Daoud">
    <header class="chrome">
      <div class="identity">
        <span class="eyebrow">IN LOVING MEMORY</span>
        <strong>Mohammad Daoud</strong>
        <span class="years">1987 — 2026</span>
      </div>
      <div id="pageStatus" class="page-status" aria-live="polite">Cover</div>
    </header>

    <div class="message-tools" aria-label="Daoud's message">
      <button id="daoudMessageBtn" type="button" class="message-action message-play" aria-pressed="false" title="Play Daoud's message">▶ To Y’all</button>
      <a id="downloadMessage" class="message-action message-download icon-only" href="assets/audio/daoud-to-yall.mp3" download="Daoud-To-Yall.mp3" title="Download Daoud's message" aria-label="Download Daoud's message">↓</a>
    </div>

    <details id="daoud-site-menu">
      <summary aria-label="Menu — Motivational Videos" title="Open site menu"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg><span>Menu</span></summary>
      <nav aria-label="Site navigation"><a href="./">Home</a><a href="./motivationalvids/">Motivational Videos</a></nav>
    </details>

    <section id="scene" class="scene" aria-label="Interactive book">
      <div class="table-shadow" aria-hidden="true"></div>
      <div class="book-viewport">
        <div id="book" class="book" tabindex="0" aria-label="Grab an outer corner and drag to turn the page"></div>
      </div>
      <div id="hint" class="hint" aria-hidden="true">
        <span class="corner-mark"></span>
        <span>grab the corner &amp; drag</span>
      </div>
    </section>

    <nav class="controls" aria-label="Book navigation">
      <button id="prevBtn" type="button" class="nav" aria-label="Previous page">‹</button>
      <button id="soundBtn" type="button" class="sound" aria-pressed="true" title="Soft background music starts after your first page interaction">♫ Music on</button>
      <button id="fullscreenBtn" type="button" class="nav fullscreen" aria-label="Enter full screen" title="Full screen">⛶</button>
      <button id="nextBtn" type="button" class="nav" aria-label="Next page">›</button>
    </nav>
    <p id="loadStatus" class="load-status" aria-live="polite">Loading book…</p>
  </main>
  <audio id="paperSound" preload="auto" src="assets/audio/paper-rustle-real.mp3?v=450"></audio>
  <audio id="ambientMusic" preload="auto" loop src="assets/audio/remembering-mohammad.mp3"></audio>
  <audio id="daoudMessage" preload="auto" src="assets/audio/daoud-to-yall.mp3"></audio>
</body>
</html>
