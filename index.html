<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
  <meta name="theme-color" content="#ede9e1" />
  <meta name="description" content="In loving memory of Mohammad Daoud, 1987–2026." />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>In Loving Memory — Mohammad Daoud</title>
  <link rel="icon" type="image/svg+xml" href="assets/daoud-favicon.svg" />
  <link rel="preload" href="assets/pages/page-001.webp" as="image" type="image/webp" />
  <link rel="preload" href="assets/pages/page-002.webp" as="image" type="image/webp" />
  <link rel="stylesheet" href="styles.css?v=460" />
  <script defer src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.min.js"></script>
  <script defer src="app.js?v=460"></script>
</head>
<body>
  <main id="reader" class="reader" aria-label="Interactive memorial book for Mohammad Daoud">
    <header class="chrome">
      <div class="identity">
        <span class="eyebrow">IN LOVING MEMORY</span>
        <strong>Mohammad Daoud</strong>
        <span class="years">1987 — 2026</span>
      </div>
      <div id="pageStatus" class="page-status" aria-live="polite">Cover</div>
    </header>

    <div class="message-tools" aria-label="Daoud's message">
      <button id="daoudMessageBtn" type="button" class="message-action message-play" aria-pressed="false" title="Play Daoud's message">▶ Daoud’s To Y’all</button>
      <a id="downloadMessage" class="message-action message-download" href="assets/audio/daoud-to-yall.mp3" download="Daoud-To-Yall.mp3" title="Download Daoud's message">↓ Download</a>
    </div>

    <section id="scene" class="scene" aria-label="Interactive book">
      <div class="table-shadow" aria-hidden="true"></div>
      <div class="book-viewport">
        <div id="book" class="book" tabindex="0" aria-label="Grab an outer corner and drag to turn the page"></div>
      </div>
      <div id="hint" class="hint" aria-hidden="true">
        <span class="corner-mark"></span>
        <span>grab the corner &amp; drag</span>
      </div>
    </section>

    <nav class="controls" aria-label="Book navigation">
      <button id="prevBtn" type="button" class="nav" aria-label="Previous page">‹</button>
      <button id="soundBtn" type="button" class="sound" aria-pressed="true" title="Soft background music starts after your first page interaction">♫ Music on</button>
      <button id="fullscreenBtn" type="button" class="nav fullscreen" aria-label="Enter full screen" title="Full screen">⛶</button>
      <button id="nextBtn" type="button" class="nav" aria-label="Next page">›</button>
    </nav>
    <p id="loadStatus" class="load-status" aria-live="polite">Loading book…</p>
  </main>
  <audio id="paperSound" preload="auto" src="assets/audio/paper-rustle-real.mp3?v=450"></audio>
  <audio id="ambientMusic" preload="auto" loop src="assets/audio/remembering-mohammad.mp3"></audio>
  <audio id="daoudMessage" preload="auto" src="assets/audio/daoud-to-yall.mp3"></audio>
</body>
</html>
